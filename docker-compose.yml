name: openrecipe

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: openrecipe
      POSTGRES_PASSWORD: openrecipe
      POSTGRES_DB: openrecipe
    ports:
      - '5432:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U openrecipe -d openrecipe']
      interval: 5s
      timeout: 3s
      retries: 20

  rustfs:
    # MinIO stopped publishing images (Docker Hub and quay.io both refuse an
    # anonymous pull now), so local object storage is RustFS: S3-compatible,
    # Apache-2.0, on Docker Hub. Pinned, so a vendor change cannot break a
    # fresh clone or CI without a commit here.
    image: rustfs/rustfs:1.0.1
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: openrecipe
      RUSTFS_SECRET_KEY: openrecipe-dev-secret
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - rustfs-data:/data
    healthcheck:
      test: ['CMD', 'curl', '-sf', 'http://127.0.0.1:9000/health']
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  db-data:
  rustfs-data:
