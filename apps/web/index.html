<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      `viewport-fit=cover` is what makes `env(safe-area-inset-*)` resolve to
      anything but zero, and cook mode is a full-screen fixed layer whose
      controls sit exactly where a notch and a home indicator are.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <!--
      Installable: "Add to Home Screen" opens the site full-screen with its own
      icon. Cook mode is the reason — a recipe on the counter should not have
      an address bar over the step.
    -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="OpenSkillet" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#fffbf5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#15120f" media="(prefers-color-scheme: dark)" />
    <!--
      The server (`og.ts`) replaces everything between the default-meta
      markers below with recipe-specific tags for a `/:handle/:slug` request,
      so a shared link's title/description/photo is the recipe's, not this
      generic fallback. Keep the whole block — title included — between the
      markers, or a crawler that takes the first of a duplicated tag will show
      this one instead.
    -->
    <!-- default-meta:start -->
    <title>OpenSkillet</title>
    <meta
      name="description"
      content="Recipes with real version history — fork, edit and propose changes like a cookbook you can pull-request."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="OpenSkillet" />
    <meta property="og:title" content="OpenSkillet" />
    <meta
      property="og:description"
      content="Recipes with real version history — fork, edit and propose changes like a cookbook you can pull-request."
    />
    <meta property="og:image" content="/social-preview.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- default-meta:end -->
    <script>
      // Before the first paint, so a reader who chose dark never gets a white
      // flash while the bundle loads. Mirrors readTheme/applyTheme in
      // src/lib/theme.ts — the key and the attribute have to stay in step.
      try {
        var stored = localStorage.getItem('openrecipe:theme');
        if (stored === 'light' || stored === 'dark') {
          document.documentElement.setAttribute('data-theme', stored);
          // Point both theme-color metas at the chosen colour, or the address
          // bar keeps answering to the OS while the page does not.
          var paper = stored === 'dark' ? '#15120f' : '#fffbf5';
          var metas = document.querySelectorAll('meta[name="theme-color"]');
          for (var i = 0; i < metas.length; i++) metas[i].content = paper;
        }
      } catch (e) {
        // Site data blocked; the system setting decides, as it did before.
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
