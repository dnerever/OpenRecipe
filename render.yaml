# The only host-specific file in the repo. Delete it on the way out — nothing
# in the application reads it, and the Dockerfile is what actually matters.
services:
  - type: web
    name: openrecipe
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # Render injects PORT; the app reads it.
      # Optional. Render injects RENDER_EXTERNAL_URL, which the app falls back
      # to, so the first deploy works without this. Set it only for a custom
      # domain — an explicit value always wins.
      - key: APP_URL
        sync: false
      - key: DATABASE_URL
        sync: false # Neon pooled connection string
      - key: BETTER_AUTH_SECRET
        generateValue: true
