name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: openskillet
          POSTGRES_PASSWORD: openskillet
          POSTGRES_DB: openskillet
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U openskillet -d openskillet"
          --health-interval 5s --health-timeout 3s --health-retries 20

    env:
      DATABASE_URL: postgres://openskillet:openskillet@localhost:5432/openskillet
      NODE_ENV: test
      # Matches docker-compose.yml, so the image tests run against here is the
      # one they run against locally. Production is R2; the point of the S3
      # protocol is that the app cannot tell the difference, and pointing CI at
      # the real bucket would mean live credentials in Actions and a test suite
      # that uploads and deletes objects in production storage.
      S3_ENDPOINT: http://127.0.0.1:9000
      S3_BUCKET: openskillet-ci
      S3_ACCESS_KEY: openskillet
      S3_SECRET_KEY: openskillet-dev-secret
      S3_REGION: auto

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Same image and tag as docker-compose.yml. MinIO no longer publishes
      # images anywhere an anonymous pull works, so this is RustFS, which
      # speaks the same S3 API. The app creates the bucket itself on first
      # use, so there is nothing to provision here.
      - name: Object storage
        run: |
          docker run -d --name rustfs -p 9000:9000 \
            -e RUSTFS_ACCESS_KEY=openskillet \
            -e RUSTFS_SECRET_KEY=openskillet-dev-secret \
            rustfs/rustfs:1.0.1
          for _ in $(seq 1 60); do
            if curl -sf http://127.0.0.1:9000/health > /dev/null; then
              echo "object storage ready"
              exit 0
            fi
            sleep 1
          done
          echo "object storage never became ready" >&2
          docker logs rustfs >&2
          exit 1

      - name: Format check
        run: npm run format:check

      - name: Build (typechecks core + api)
        run: npm run build

      - name: Typecheck web
        run: npm run typecheck -w @openskillet/web

      # After the build: the apps import core's compiled `dist/`, and type-aware
      # rules see every import from it as an error type until it exists.
      - name: Lint
        run: npm run lint

      - name: Migrate
        run: npm run db:migrate

      - name: Test
        run: npm test

      # The three browser flows, against the build above served the way the
      # container serves it. A few seconds of browser time; cheap enough to run
      # on every push rather than nightly.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # The Dockerfile is the portability contract — if it stops building, moving
  # hosts stops being a 20-minute job. Cheaper to catch here than at deploy.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
